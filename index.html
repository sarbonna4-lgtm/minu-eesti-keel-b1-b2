function setFillMode(m){fillMode=m;fillValue='';fillResult=null;render()}function fallbackFillAnswer(){return fillExercises[fillOrder[fillPos]].answer}function checkFill(){let id=fillOrder[fillPos],f=fillExercises[id];if(fillMode==='type')fillValue=document.getElementById('fillInput')?.value||fillValue;fillResult=fillValue.trim().toLocaleLowerCase('et')===f.answer;state.fillAttempts[id]=(state.fillAttempts[id]||0)+1;if(fillResult)mark('fillCorrect',id);save();render()}function nextFill(d){fillPos+=d;if(fillPos>=fillOrder.length){newFillRound();return}if(fillPos<0)fillPos=fillOrder.length-1;fillValue='';fillResult=null;fillOptions=[];render()}function newFillRound(){fillOrder=shuffle([...fillExercises.keys()]);fillPos=0;fillValue='';fillResult=null;fillOptions=[];render()}function newSentenceRound(){sentenceOrder=shuffle([...sentences.keys()]);sentencePos=0;si=sentenceOrder[0];startSentence();render()}function addWord(i){selected.push(pool.splice(i,1)[0]);feedback='';render()}function removeWord(i){pool.push(selected.splice(i,1)[0]);feedback='';render()}function checkSentence(){let expected=sentences[si].s;let actual=selected.map(x=>x.w).join(' ');if(actual===expected){mark('sentences',si);feedback='Верно! Ты самостоятельно составила предложение. ✓'}else if(selected.length!==expected.split(' ').length){feedback='Пока не все слова использованы. Попробуй ещё раз.'}else{feedback='Пока порядок слов отличается от образца. Попробуй переставить слова. Возможные альтернативные порядки в этой демоверсии автоматически не оцениваются.'}render()}function reviewInterview(){interviewAnswer=$('reply').value;feedback='show';render()}function confirmInterview(){interviewAnswer=$('reply').value;mark('interviews',ii);feedback='';render()}function copyPrompt(){let t=$('reply').value;interviewAnswer=t;let q=interviews[ii][0];let prompt=`Ты преподаватель эстонского языка B1–B2. Вопрос собеседования: ${q}\nМой ответ: ${t||'[ответ пока не написан]'}\nИсправь ошибки максимально близко к моему тексту, объясни по-русски, затем предложи более естественный вариант на эстонском. Не выдумывай мои навыки или опыт.`;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(prompt).then(()=>alert('Скопировано. Вставь текст в ChatGPT или Gemini.')).catch(()=>promptFallback(prompt))}else{promptFallback(prompt)}}function promptFallback(t){window.prompt('Скопируй этот текст:',t)}function exportProgress(){let blob=new Blob([JSON.stringify({exported:new Date().toISOString(),progress:state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eesti-b2-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetProgress(){if(confirm('Удалить весь прогресс на этом устройстве?')){state=structuredClone(initial);save();render()}}si=sentenceOrder[0];startSentence();render();</script></body></html>
